name: Refresh GitHub Profile

on:
  schedule:
    - cron: "17 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_stats.py

      - name: Commit generated files
        run: |
          FILES="assets/stats.svg assets/streak.svg assets/langs.svg assets/year.svg"

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No statistics changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- $FILES
          git commit -m "stats: refresh GitHub profile"
          git push